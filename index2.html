    <style>
      body {font-family: Arial;}
      /* Style the tab */
      .tab {
        overflow: hidden;
        border: 1px solid #ccc;
        background-color: #f1f1f1;
      }
      /* Style the buttons inside the tab */
      .tab button {
        background-color: inherit;
        float: left;
        border: none;
        outline: none;
        cursor: pointer;
        padding: 14px 16px;
        transition: 0.3s;
        font-size: 17px;
      }
      /* Change background color of buttons on hover */
      .tab button:hover {
        background-color: #ddd;
      }
      /* Create an active/current tablink class */
      .tab button.active {
        background-color: #ccc;
      }
      /* Style the tab content */
      .tabcontent {
        display: none;
        padding: 6px 12px;
        -webkit-animation: fadeEffect 1s;
        animation: fadeEffect 1s;
      }
      /* Fade in tabs */
      @-webkit-keyframes fadeEffect {
        from {opacity: 0;}
        to {opacity: 1;}
      }
      @keyframes fadeEffect {
        from {opacity: 0;}
        to {opacity: 1;}
      }
    </style>
  </head>

  <script>
  function includeHTML() {
    var z, i, elmnt, file, xhttp;
    z = document.getElementsByTagName("*");
    for (i = 0; i < z.length; i++) {
      elmnt = z[i];
      file = elmnt.getAttribute("w3-include-html");
      if (file) {
        xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function() {
          if (this.readyState == 4) {
           if (this.status == 200) {elmnt.innerHTML = this.responseText;}
            if (this.status == 404) {elmnt.innerHTML = "Page not found.";}
            elmnt.removeAttribute("w3-include-html");
            includeHTML();
          }
        }      
        xhttp.open("GET", file, true);
        xhttp.send();
        return;
      }
    }
  };
  </script>

  <body>

    <div style="background-color:black;">
      <img class="w3-bar-item" src="https://raw.githubusercontent.com/TheTideAndTheTempest/TheTideAndTheTempest/pre-release/image/runic_tTntT_w_350x135.png">
    </div>

    <!-- Header -->
    <div class="tab">
      <button class="tablinks" onclick="openContent(event, 'band')" id="defaultOpen">Band</button>
      <button class="tablinks" onclick="openContent(event, 'music')">Music</button>
      <button class="tablinks" onclick="openContent(event, 'shows')">Shows</button>
      <button class="tablinks" onclick="openContent(event, 'contact')">Contact</button>
    </div>

    <!-- Content -->
    <div id="band" class="tabcontent">
      <div w3-include-html="band.html"></div>
    </div>
    <div id="music" class="tabcontent">
      <div w3-include-html="music.html"></div>
    </div>
    <div id="shows" class="tabcontent">
      <div w3-include-html="shows.html"></div>
    </div>
    <div id="contact" class="tabcontent">
      <div w3-include-html="contact.html"></div>
    </div>

    <!-- Footer -->
    <div w3-include-html="footer.html"></div>

    <script>
      includeHTML();
    </script>

    <script>
      function openContent(evt, conentName) {
        var i, tabcontent, tablinks;
        tabcontent = document.getElementsByClassName("tabcontent");
        for (i = 0; i < tabcontent.length; i++) {
          tabcontent[i].style.display = "none";
        }
        tablinks = document.getElementsByClassName("tablinks");
        for (i = 0; i < tablinks.length; i++) {
          tablinks[i].className = tablinks[i].className.replace(" active", "");
        }
        document.getElementById(conentName).style.display = "block";
        evt.currentTarget.className += " active";
      }

      document.getElementById("defaultOpen").click();
    </script>
